spring:
  application:
    name: url-shortener

  # In-memory H2. The shortener's data is demo data with no durability requirement, and
  # running fully in-process is what lets a reviewer do `mvn spring-boot:run` with no
  # Docker, no database install, and no setup steps.
  #
  # This is NOT the same choice as the orchestrator, whose H2 is file-backed because its
  # durability across restarts is a load-bearing part of the design.
  datasource:
    url: jdbc:h2:mem:shortener;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  # Virtual threads for request handling: the redirect path is I/O bound and this keeps
  # the hot path cheap under concurrency. Final since Java 21, no preview flags.
  threads:
    virtual:
      enabled: true

server:
  port: 8081

logging:
  # Structured JSON on stdout, so logs are queryable rather than grep-able. Built into
  # Spring Boot, so no logback appender or extra dependency is needed.
  #
  # The correlation id set by CorrelationIdFilter is in the MDC, which the ECS format
  # includes automatically - which is the point of putting it there rather than
  # interpolating it into each message.
  structured:
    format:
      console: ecs
  level:
    com.agenticsdlc: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

shortener:
  # Origin used to build the shortUrl field in responses. Override when deployed behind a
  # real hostname, or every response will advertise a URL nobody can reach.
  base-url: http://localhost:8081

  # Storage adapter: jpa (default) or in-memory. Both pass the same contract test.
  repository: jpa

  analytics:
    # Bounded on purpose. An unbounded queue does not remove the failure, it converts a
    # latency problem into an out-of-memory one at peak load. Overflow is dropped and
    # counted via the shortener.analytics.dropped metric.
    queue-capacity: 10000

  safety:
    # Off by default: DNS resolution puts a network round trip on the create path and is
    # defeated by rebinding, so it buys less than it appears to. See
    # SsrfAwareUrlSafetyChecker for the full reasoning.
    resolve-dns: false
    denied-domains: []

  rate-limit:
    enabled: true
    capacity: 60
    refill: 60
    refill-period: 1m

  idempotency:
    ttl: 10m
    max-keys: 10000
